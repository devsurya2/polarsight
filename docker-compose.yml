# POLARSIGHT local infrastructure.
#
# This Postgres is dedicated to the project. It runs on 5433 and uses
# its own credentials and its own named volume, so it cannot collide
# with or alter any PostgreSQL already installed on the host.

services:
  postgres:
    image: postgres:17-alpine
    container_name: polarsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Fail fast rather than silently accepting weak auth
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Host 5433 on purpose: 5432 may belong to a system install.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - polarsight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Malware scanner for uploads. Optional locally (profile "scan"),
  # required in production: the API refuses to start without it.
  #   docker compose --profile scan up -d clamav
  clamav:
    image: clamav/clamav:stable
    container_name: polarsight-clamav
    profiles: ["scan"]
    restart: unless-stopped
    ports:
      # Loopback only: nothing outside this host should reach clamd.
      - "127.0.0.1:3310:3310"
    volumes:
      - polarsight-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  polarsight-clamav:
    name: polarsight-clamav
  polarsight-pgdata:
    name: polarsight-pgdata
