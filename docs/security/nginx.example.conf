# Reverse proxy in front of the three units. TLS terminates here; the
# API sees X-Forwarded-For and must run with TRUST_PROXY=true.
# The admin build is static files, so its security headers come from
# this file (the <meta> CSP in its index.html is only a floor).

map $sent_http_content_type $csp_admin {
    default "";
    "~^text/html" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; connect-src 'self' https://api.example.com; media-src 'self' https://api.example.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;
    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp_admin always;
    add_header Cache-Control "no-store" always;

    root /srv/polarsight/admin/dist;
    location /api/   { proxy_pass https://api.example.com/api/;   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
    location /media/ { proxy_pass https://api.example.com/media/; }
    location / { try_files $uri /index.html; }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 70m;   # media uploads; resumes are capped at 5 MB by the API itself
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name admin.example.com api.example.com www.example.com;
    return 301 https://$host$request_uri;
}
